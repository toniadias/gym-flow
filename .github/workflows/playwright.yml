name: E2E Tests (Playwright)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # SETUP DO AMBIENTE
      # =========================
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # PREPARAÇÃO DO BACKEND
      # =========================
      - name: Criar .env do Backend
        run: |
          echo "DATABASE_URL=file:./dev.db" > backend/.env
          echo "PORT=3001" >> backend/.env

      - name: Instalar dependências (Backend)
        working-directory: backend
        run: npm install

      - name: Gerar Prisma Client
        working-directory: backend
        run: npx prisma generate

      # =========================
      # BANCO DE DADOS (RESET + SEED)
      # =========================
      # Este comando apaga o banco, recria as tabelas e roda o seed.js automaticamente
      - name: Resetar e Popular Banco de Dados
        working-directory: backend
        run: npx prisma migrate reset --force

      # =========================
      # EXECUÇÃO DO SERVIDOR
      # =========================
      - name: Subir backend em background
        working-directory: backend
        run: |
          nohup npm run start > backend.log 2>&1 &

      - name: Esperar backend ficar saudável
        run: npx wait-on http://127.0.0.1:3001/health --timeout 60000

      # =========================
      # TESTES E2E (PLAYWRIGHT)
      # =========================
      - name: Instalar dependências (Tests)
        working-directory: tests
        run: npm install

      - name: Instalar browsers do Playwright
        working-directory: tests
        run: npx playwright install --with-deps

      - name: Executar testes Playwright
        working-directory: tests
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:3001

      # =========================
      # RELATÓRIOS
      # =========================
      - name: Upload do relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30